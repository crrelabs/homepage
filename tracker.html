<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRRE Labs — Cron & Heartbeat Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #0a0f1a; color: #e2e8f0; }
  .gold { color: #c9952c; }
  .card { background: #111827; border: 1px solid #1e293b; border-radius: 0.75rem; transition: all 0.2s; }
  .card:hover { border-color: #c9952c44; }
  .card.has-error { border-left: 3px solid #ef4444; }
  .card.disabled { opacity: 0.45; }
  .agent-col { min-width: 300px; max-width: 340px; }
  .status-ok { background: #065f46; color: #6ee7b7; }
  .status-error { background: #7f1d1d; color: #fca5a5; }
  .status-skipped { background: #713f12; color: #fde68a; }
  .status-idle { background: #374151; color: #9ca3af; }
  .heartbeat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .heartbeat-active { background: #34d399; box-shadow: 0 0 6px #34d399; }
  .heartbeat-inactive { background: #6b7280; }
  .run-row:nth-child(odd) { background: #1a2234; }
  .expand-btn { cursor: pointer; user-select: none; }
  ::-webkit-scrollbar { height: 8px; }
  ::-webkit-scrollbar-track { background: #0a0f1a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="text-xl font-bold gold">CRRE Labs Cron & Heartbeat Tracker</h1>
    <p class="text-xs text-gray-500 mt-1">Internal operations dashboard</p>
  </div>
  <div class="flex items-center gap-4 text-sm text-gray-400">
    <span id="lastSynced">Loading...</span>
    <span class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      Auto-refresh 5m
    </span>
  </div>
</header>

<div id="summaryBar" class="px-6 py-3 flex flex-wrap gap-3 border-b border-gray-800 text-sm"></div>

<div id="board" class="p-6 flex gap-4 overflow-x-auto pb-8" style="min-height: calc(100vh - 120px);"></div>

<script>
const REFRESH_MS = 300000;
let data = null;

function relTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  const now = Date.now();
  const diff = now - d.getTime();
  const future = diff < 0;
  const abs = Math.abs(diff);
  const m = Math.floor(abs / 60000);
  const h = Math.floor(abs / 3600000);
  const days = Math.floor(abs / 86400000);
  if (m < 1) return future ? 'now' : 'just now';
  if (m < 60) return future ? 'in ' + m + 'm' : m + 'm ago';
  if (h < 24) return future ? 'in ' + h + 'h' : h + 'h ago';
  if (days < 7) return future ? 'in ' + days + 'd' : days + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function cronToHuman(expr) {
  if (!expr || expr.startsWith('every') || expr.startsWith('once')) return expr;
  var p = expr.split(' ');
  if (p.length < 5) return expr;
  var min = p[0], hr = p[1], dom = p[2], mon = p[3], dow = p[4];
  var parts = [];
  var h = hr.indexOf(',') >= 0
    ? hr.split(',').map(function(x){ return x + ':' + min.padStart(2,'0'); }).join(', ')
    : hr + ':' + min.padStart(2,'0');
  parts.push(h);
  if (dow !== '*' && dow !== '?') {
    var days = {0:'Sun',1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',7:'Sun'};
    var dstr = dow.replace(/(\d)/g, function(m){ return days[m] || m; });
    parts.push(dstr);
  }
  if (dom !== '*') parts.push('days ' + dom);
  if (mon !== '*') parts.push('month ' + mon);
  return parts.join(' \u00b7 ');
}

function statusBadge(s) {
  var map = {
    ok: ['\ud83d\udfe2', 'status-ok'],
    error: ['\ud83d\udd34', 'status-error'],
    skipped: ['\ud83d\udfe1', 'status-skipped'],
    idle: ['\u26aa', 'status-idle']
  };
  var pair = map[s] || map.idle;
  return '<span class="px-2 py-0.5 rounded-full text-xs font-medium ' + pair[1] + '">' + pair[0] + ' ' + s + '</span>';
}

function isActiveHours() {
  var now = new Date();
  var et = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  return et.getHours() >= 8 && et.getHours() < 22;
}

function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderSummary() {
  var bar = document.getElementById('summaryBar');
  var total = 0, ok = 0, errors = 0, other = 0;
  Object.values(data.agents).forEach(function(a){ a.jobs.forEach(function(j){
    total++;
    if (j.lastStatus === 'ok') ok++;
    else if (j.lastStatus === 'error') errors++;
    else other++;
  });});
  bar.innerHTML =
    '<span class="px-3 py-1 rounded-lg bg-gray-800">\ud83d\udccb ' + total + ' jobs</span>' +
    '<span class="px-3 py-1 rounded-lg status-ok">\u2705 ' + ok + ' OK</span>' +
    (errors ? '<span class="px-3 py-1 rounded-lg status-error">\u274c ' + errors + ' errors</span>' : '') +
    (other ? '<span class="px-3 py-1 rounded-lg status-idle">\u23f8 ' + other + ' idle/skipped</span>' : '');
}

function renderCard(job) {
  var errClass = job.lastStatus === 'error' ? 'has-error' : '';
  var disClass = !job.enabled ? 'disabled' : '';
  var consErr = job.consecutiveErrors > 0
    ? '<span class="text-red-400 text-xs font-medium">\ud83d\udd25 ' + job.consecutiveErrors + ' consecutive errors</span>' : '';
  var duration = job.lastDuration
    ? '<span class="text-gray-500 text-xs">' + (job.lastDuration/1000).toFixed(1) + 's</span>' : '';
  var disabledBadge = !job.enabled
    ? '<span class="px-1.5 py-0.5 rounded text-xs bg-gray-700 text-gray-400 font-medium">DISABLED</span>' : '';

  var hasDetails = job.lastError || (job.recentRuns && job.recentRuns.length > 0);
  var expandId = 'detail-' + job.id;

  var detailHtml = '';
  if (hasDetails) {
    var runsHtml = '';
    if (job.recentRuns && job.recentRuns.length) {
      runsHtml = '<div class="mt-2"><p class="text-xs text-gray-500 mb-1">Recent runs:</p><div class="text-xs space-y-0.5">';
      job.recentRuns.forEach(function(r){
        runsHtml += '<div class="run-row flex justify-between px-2 py-0.5 rounded">' +
          '<span>' + (r.ts ? new Date(r.ts).toLocaleString() : '?') + '</span>' +
          '<span>' + (r.status === 'error' ? '\ud83d\udd34' : '\ud83d\udfe2') + ' ' + esc(r.status) + '</span>' +
          '<span>' + (r.duration ? (r.duration/1000).toFixed(1)+'s' : '\u2014') + '</span></div>';
      });
      runsHtml += '</div></div>';
    }
    detailHtml = '<div id="' + expandId + '" class="hidden mt-2 pt-2 border-t border-gray-700">' +
      (job.lastError ? '<p class="text-xs text-red-400 break-all mb-1">\u26a0\ufe0f ' + esc(job.lastError) + '</p>' : '') +
      runsHtml + '</div>';
  }

  return '<div class="card p-3 mb-2 ' + errClass + ' ' + disClass + (hasDetails ? ' expand-btn' : '') + '"' +
    (hasDetails ? ' onclick="document.getElementById(\'' + expandId + '\').classList.toggle(\'hidden\')"' : '') + '>' +
    '<div class="flex items-start justify-between gap-2">' +
    '<p class="font-semibold text-sm leading-tight">' + esc(job.name) + '</p>' +
    '<div class="flex-shrink-0 flex items-center gap-1">' + statusBadge(job.lastStatus) + ' ' + disabledBadge + '</div></div>' +
    '<p class="text-xs text-gray-400 mt-1 font-mono">' + esc(cronToHuman(job.schedule)) +
    (job.timezone !== 'UTC' ? ' <span class="text-gray-600">' + esc(job.timezone.replace('America/','')) + '</span>' : '') + '</p>' +
    '<div class="flex items-center gap-3 mt-2 text-xs text-gray-400">' +
    '<span>Last: ' + relTime(job.lastRun) + '</span>' +
    '<span>Next: ' + relTime(job.nextRun) + '</span>' +
    duration + '</div>' +
    (consErr ? '<div class="mt-1">' + consErr + '</div>' : '') +
    detailHtml +
    (hasDetails ? '<p class="text-xs text-gray-600 mt-1">click to expand \u203a</p>' : '') +
    '</div>';
}

function renderBoard() {
  var board = document.getElementById('board');
  var active = isActiveHours();
  var html = '';
  var agentOrder = ['main', 'lex', 'ellie', 'moneypenny', 'elara', 'bebe', 'sanitas', 'atlas'];
  agentOrder.forEach(function(aid){
    var agent = data.agents[aid];
    if (!agent) return;
    var dotClass = active ? 'heartbeat-active' : 'heartbeat-inactive';
    var jobs = agent.jobs.slice().sort(function(a, b){
      if (a.lastStatus === 'error' && b.lastStatus !== 'error') return -1;
      if (b.lastStatus === 'error' && a.lastStatus !== 'error') return 1;
      var aNext = a.nextRun ? new Date(a.nextRun).getTime() : Infinity;
      var bNext = b.nextRun ? new Date(b.nextRun).getTime() : Infinity;
      return aNext - bNext;
    });
    html += '<div class="agent-col flex-shrink-0">' +
      '<div class="flex items-center gap-2 mb-3 px-1">' +
      '<span class="heartbeat-dot ' + dotClass + '"></span>' +
      '<h2 class="font-bold text-base gold">' + esc(agent.label) + '</h2>' +
      '<span class="text-xs text-gray-500">' + agent.jobs.length + ' jobs</span></div>' +
      '<div class="space-y-0">' + jobs.map(renderCard).join('') + '</div></div>';
  });
  board.innerHTML = html;
}

function updateSyncTime() {
  if (!data) return;
  document.getElementById('lastSynced').textContent = 'Data: ' + relTime(data.updated_at);
}

function fetchData() {
  fetch('tracker-data.json?' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d;
      renderSummary();
      renderBoard();
      updateSyncTime();
    })
    .catch(function(e){ console.error('Fetch failed:', e); });
}

fetchData();
setInterval(fetchData, REFRESH_MS);
setInterval(updateSyncTime, 30000);
</script>
</body>
</html>
